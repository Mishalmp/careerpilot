name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: careerpilot
          POSTGRES_PASSWORD: careerpilot_dev
          POSTGRES_DB: careerpilot
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U careerpilot -d careerpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CAREERPILOT_DATABASE_URL: postgresql+asyncpg://careerpilot:careerpilot_dev@127.0.0.1:5433/careerpilot
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - name: PostgreSQL 16 client tools (the backup restore test needs a matching pg_dump)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: uv run pytest
      - name: Notes search quality (downloads the embedding model, cached between runs)
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: uv run pytest tests/test_rag_eval.py
        env:
          CAREERPILOT_RUN_MODEL_TESTS: "1"
      - name: OpenAPI file is up to date
        run: |
          uv run python -m careerpilot.export_openapi openapi.json
          git diff --exit-code openapi.json
      - run: uvx pip-audit --skip-editable || true  # advisory until the baseline is clean

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
