# One normalised skill list. Job scoring finds these in a job description and in your profile.
# `name` is the canonical form; `aliases` are other spellings. Matching ignores case unless
# `exact_case: true`. Keep ambiguous words out (for example the language "Go" is only matched as
# "Golang"), because a wrong match is worse than a missing one.
skills:
  # languages
  - {name: python, aliases: [python3]}
  - {name: typescript, aliases: [ts]}
  - {name: javascript, aliases: [js, ecmascript]}
  - {name: java}
