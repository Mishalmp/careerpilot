slug: maximum-subarray
title: Maximum Subarray
kind: function
difficulty: Medium
tags: [dynamic-programming, arrays]
topic_keys: [dsa-and-coding-rounds-dynamic-programming-1d-2d-knapsack-basics, dsa-and-coding-rounds-arrays-strings-hashing]
statement: |
  Return the largest sum of any non-empty contiguous slice of `nums`.

  There is a one-pass O(n) solution: at each element, decide whether to extend the current slice or start
  a new one.
signature:
  name: max_subarray
  params:
  - {name: nums, type: 'int[]'}
  returns: int
tests:
- name: mixed
  args:
  - [-2, 1, -3, 4, -1, 2, 1, -5, 4]
  expected: 6
- name: single
  args:
  - [1]
  expected: 1
- name: mostly positive
  args:
  - [5, 4, -1, 7, 8]
  expected: 23
- name: all negative
  args:
  - [-3, -2, -1]
  expected: -1
- name: one negative
  args:
  - [-1]
  expected: -1
  hidden: true
- name: zeros
  args:
  - [0, 0, 0]
  expected: 0
  hidden: true
- name: negatives at both ends
  args:
  - [-2, -1]
  expected: -1
  hidden: true
