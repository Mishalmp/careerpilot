slug: longest-login-streak
title: Longest Login Streak
kind: sql
difficulty: Hard
tags: [sql, window-functions, gaps-and-islands]
topic_keys: [sql-and-postgresql-classic-query-problems-second-highest-duplicates-gaps-and-islands-sess,
  sql-and-postgresql-window-functions-row-number-rank-lag-lead-running-totals]
statement: |
  Table `logins(user_id, day)`. A user may log in several times on the same day (duplicate rows).

  For each user, return `user_id` and `longest_streak`: the greatest number of consecutive calendar days
  on which they logged in. Row order does not matter.

  This is the classic "gaps and islands" problem.
sql:
  ddl: |
    CREATE TABLE logins (user_id int, day date);
  starter: |
    -- Return user_id and longest_streak.
    SELECT user_id, COUNT(*) AS longest_streak FROM logins GROUP BY user_id;
  tests:
  - name: three users
    data: |
      INSERT INTO logins VALUES (1,'2024-01-01'),(1,'2024-01-02'),(1,'2024-01-03'),(1,'2024-01-05'),(2,'2024-01-01'),(2,'2024-01-03'),(3,'2024-01-10'),(3,'2024-01-11');
    expected:
      columns: [user_id, longest_streak]
      rows:
      - [1, 3]
      - [2, 1]
      - [3, 2]
  - name: duplicates on one day
    data: |
      INSERT INTO logins VALUES (1,'2024-02-01'),(1,'2024-02-01'),(1,'2024-02-02');
    expected:
      columns: [user_id, longest_streak]
      rows:
      - [1, 2]
  - name: a later, longer streak
    data: |
      INSERT INTO logins VALUES (7,'2024-03-01'),(7,'2024-03-02'),(7,'2024-03-10'),(7,'2024-03-11'),(7,'2024-03-12'),(7,'2024-03-13');
    expected:
      columns: [user_id, longest_streak]
      rows:
      - [7, 4]
    hidden: true
  - name: month boundary
    data: |
      INSERT INTO logins VALUES (9,'2024-01-30'),(9,'2024-01-31'),(9,'2024-02-01');
    expected:
      columns: [user_id, longest_streak]
      rows:
      - [9, 3]
    hidden: true
