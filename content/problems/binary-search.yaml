slug: binary-search
title: Binary Search
kind: function
difficulty: Easy
tags: [binary-search, arrays]
topic_keys: [dsa-and-coding-rounds-binary-search-and-variants]
statement: |
  `nums` is sorted in ascending order and has no duplicates. Return the index of `target`, or `-1` if it is
  not there.

  Your solution must run in O(log n): halve the search range each step.
signature:
  name: search
  params:
  - {name: nums, type: 'int[]'}
  - {name: target, type: int}
  returns: int
tests:
- name: found
  args:
  - [-1, 0, 3, 5, 9, 12]
  - 9
  expected: 4
- name: missing
  args:
  - [-1, 0, 3, 5, 9, 12]
  - 2
  expected: -1
- name: single, found
  args:
  - [5]
  - 5
  expected: 0
- name: single, missing
  args:
  - [5]
  - -5
  expected: -1
- name: empty
  args:
  - []
  - 3
  expected: -1
  hidden: true
- name: last element
  args:
  - [1, 3, 5, 7, 9, 11, 13]
  - 13
  expected: 6
  hidden: true
- name: first element
  args:
  - [1, 3, 5, 7, 9, 11, 13]
  - 1
  expected: 0
  hidden: true
