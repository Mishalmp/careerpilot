slug: course-schedule
title: Course Schedule
kind: function
difficulty: Medium
tags: [graphs, topological-sort]
topic_keys: [dsa-and-coding-rounds-graphs-bfs-dfs-topological-sort]
statement: |
  There are `n` courses numbered `0` to `n - 1`. Each pair `[a, b]` in `prerequisites` means you must take
  course `b` before course `a`. Return `true` if you can finish all courses, which is the same as asking
  whether the dependency graph has no cycle.
signature:
  name: can_finish
  params:
  - {name: n, type: int}
  - {name: prerequisites, type: 'int[][]'}
  returns: bool
tests:
- name: simple chain
  args:
  - 2
  - - [1, 0]
  expected: true
- name: two-course cycle
  args:
  - 2
  - - [1, 0]
    - [0, 1]
  expected: false
- name: no prerequisites
  args:
  - 1
  - []
  expected: true
- name: longer chain
  args:
  - 4
  - - [1, 0]
    - [2, 1]
    - [3, 2]
  expected: true
- name: three-course cycle
  args:
  - 3
  - - [0, 1]
    - [1, 2]
    - [2, 0]
  expected: false
  hidden: true
- name: diamond
  args:
  - 5
  - - [1, 0]
    - [2, 0]
    - [3, 1]
    - [3, 2]
    - [4, 3]
  expected: true
  hidden: true
- name: self dependency
  args:
  - 2
  - - [0, 0]
  expected: false
  hidden: true
