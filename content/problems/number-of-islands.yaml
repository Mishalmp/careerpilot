slug: number-of-islands
title: Number of Islands
kind: function
difficulty: Medium
tags: [graphs, bfs-dfs]
topic_keys: [dsa-and-coding-rounds-graphs-bfs-dfs-topological-sort]
statement: |
  `grid` is a list of equal-length strings of `"1"` (land) and `"0"` (water). An island is a group of land
  cells connected up, down, left or right (not diagonally). Return the number of islands.
signature:
  name: num_islands
  params:
  - {name: grid, type: 'str[]'}
  returns: int
tests:
- name: one big island
  args:
  - ['11110', '11010', '11000', '00000']
  expected: 1
- name: three islands
  args:
  - ['11000', '11000', '00100', '00011']
  expected: 3
- name: empty grid
  args:
  - []
  expected: 0
- name: single land cell
  args:
  - ['1']
  expected: 1
- name: single water cell
  args:
  - ['0']
  expected: 0
  hidden: true
- name: diagonals do not connect
  args:
  - ['101', '010', '101']
  expected: 5
  hidden: true
