slug: top-k-frequent
title: Top K Frequent Elements
kind: function
difficulty: Medium
tags: [heaps, hashing]
topic_keys: [dsa-and-coding-rounds-heaps-and-top-k, python-collections-and-complexity-list-dict-set-deque-heapq-counter]
statement: |
  Return the `k` most frequent values in `nums`.

  Order the result by frequency, highest first. When two values have the same frequency, the smaller value
  comes first. `k` is never larger than the number of distinct values.
signature:
  name: top_k_frequent
  params:
  - {name: nums, type: 'int[]'}
  - {name: k, type: int}
  returns: int[]
tests:
- name: example
  args:
  - [1, 1, 1, 2, 2, 3]
  - 2
  expected: [1, 2]
- name: single
  args:
  - [1]
  - 1
  expected: [1]
- name: tie broken by value
  args:
  - [4, 4, 5, 5, 6]
  - 2
  expected: [4, 5]
- name: negative tie
  args:
  - [-1, -1, 2, 2, 3]
  - 1
  expected: [-1]
  hidden: true
- name: three levels
  args:
  - [5, 3, 5, 3, 1, 1, 1]
  - 2
  expected: [1, 3]
  hidden: true
