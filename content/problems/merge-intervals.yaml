slug: merge-intervals
title: Merge Intervals
kind: function
difficulty: Medium
tags: [intervals, sorting]
topic_keys: [dsa-and-coding-rounds-intervals-and-sorting-patterns]
statement: |
  Given a list of `[start, end]` intervals, merge all that overlap (touching at an endpoint counts as
  overlapping) and return the merged intervals sorted by start.

  The input is not sorted.
signature:
  name: merge
  params:
  - {name: intervals, type: 'int[][]'}
  returns: int[][]
tests:
- name: example
  args:
  - - [1, 3]
    - [2, 6]
    - [8, 10]
    - [15, 18]
  expected:
  - [1, 6]
  - [8, 10]
  - [15, 18]
- name: touching
  args:
  - - [1, 4]
    - [4, 5]
  expected:
  - [1, 5]
- name: unsorted
  args:
  - - [8, 10]
    - [1, 3]
    - [2, 6]
  expected:
  - [1, 6]
  - [8, 10]
- name: contained
  args:
  - - [1, 4]
    - [2, 3]
  expected:
  - [1, 4]
- name: empty
  args:
  - []
  expected: []
  hidden: true
- name: starts earlier later in the list
  args:
  - - [1, 4]
    - [0, 4]
  expected:
  - [0, 4]
  hidden: true
- name: zero-length interval
  args:
  - - [1, 4]
    - [0, 0]
  expected:
  - [0, 0]
  - [1, 4]
  hidden: true
