slug: rotate-matrix
title: Rotate Image
kind: function
difficulty: Medium
tags: [arrays, matrix]
topic_keys: [dsa-and-coding-rounds-arrays-strings-hashing]
statement: |
  Return a new matrix: `matrix` rotated 90 degrees clockwise. The matrix is not always square, so the result
  may have a different shape from the input.
signature:
  name: rotate
  params:
  - {name: matrix, type: 'int[][]'}
  returns: int[][]
tests:
- name: 3 by 3
  args:
  - - [1, 2, 3]
    - [4, 5, 6]
    - [7, 8, 9]
  expected:
  - [7, 4, 1]
  - [8, 5, 2]
  - [9, 6, 3]
- name: 2 by 2
  args:
  - - [1, 2]
    - [3, 4]
  expected:
  - [3, 1]
  - [4, 2]
- name: one cell
  args:
  - - [1]
  expected:
  - [1]
- name: 2 by 3
  args:
  - - [1, 2, 3]
    - [4, 5, 6]
  expected:
  - [4, 1]
  - [5, 2]
  - [6, 3]
- name: single row
  args:
  - - [1, 2, 3, 4]
  expected:
  - [1]
  - [2]
  - [3]
  - [4]
  hidden: true
- name: single column
  args:
  - - [1]
    - [2]
    - [3]
  expected:
  - [3, 2, 1]
  hidden: true
