slug: merge-k-sorted-lists
title: Merge K Sorted Lists
kind: function
difficulty: Hard
tags: [heaps, sorting]
topic_keys: [dsa-and-coding-rounds-heaps-and-top-k]
statement: |
  Each list in `lists` is sorted ascending. Return one sorted list containing every value.

  Think about the cost: a min-heap holding one candidate from each list merges them in O(N log k).
signature:
  name: merge_k_sorted
  params:
  - {name: lists, type: 'int[][]'}
  returns: int[]
tests:
- name: three lists
  args:
  - - [1, 4, 5]
    - [1, 3, 4]
    - [2, 6]
  expected: [1, 1, 2, 3, 4, 4, 5, 6]
- name: no lists
  args:
  - []
  expected: []
- name: empty lists
  args:
  - - []
    - []
  expected: []
- name: two single lists
  args:
  - - [1]
    - [0]
  expected: [0, 1]
- name: negatives and an empty list
  args:
  - - [-5, 0, 5]
    - []
    - [2]
  expected: [-5, 0, 2, 5]
  hidden: true
- name: duplicates
  args:
  - - [2, 2]
    - [2]
  expected: [2, 2, 2]
  hidden: true
