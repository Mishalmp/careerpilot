slug: product-except-self
title: Product of Array Except Self
kind: function
difficulty: Medium
tags: [arrays, prefix-sums]
topic_keys: [dsa-and-coding-rounds-arrays-strings-hashing]
statement: |
  Return a list `answer` where `answer[i]` is the product of every element of `nums` except `nums[i]`.

  Do not use division. There is an O(n) solution with a left-to-right pass and a right-to-left pass.
signature:
  name: product_except_self
  params:
  - {name: nums, type: 'int[]'}
  returns: int[]
tests:
- name: example
  args:
  - [1, 2, 3, 4]
  expected: [24, 12, 8, 6]
- name: with a zero
  args:
  - [-1, 1, 0, -3, 3]
  expected: [0, 0, 9, 0, 0]
- name: two items
  args:
  - [2, 3]
  expected: [3, 2]
- name: two zeros
  args:
  - [0, 0]
  expected: [0, 0]
  hidden: true
- name: ones
  args:
  - [1, 1, 1]
  expected: [1, 1, 1]
  hidden: true
- name: zero in the middle
  args:
  - [5, 0, 2]
  expected: [0, 10, 0]
  hidden: true
