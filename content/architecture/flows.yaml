# Step-by-step flows for the explorer's flow player. Steps use node ids from systems.yaml (overview).
# A step may have a `failure`: what goes wrong there and what the system does about it.
# `proof` names test files that show the behaviour (a test checks they exist).

flows:
  - id: sign-in
    title: "Sign in and session"
    summary: "How a login becomes a session that is safe against cross-site requests."
    status: built
    proof: [apps/api/tests/test_auth.py, apps/api/tests/test_security.py]
    steps:
      - from: browser
        to: web
        label: "Submit the login form"
        detail: "The browser sends email and password to the web app over a normal form POST handled by JavaScript."
      - from: web
        to: api
        label: "Forward /api/v1/auth/login"
        detail: "The web app proxies the request, so the browser only ever talks to one origin and no CORS is needed."
        failure:
          label: "Too many wrong passwords"
          detail: "After five failures in a window the API answers 429 with Retry-After. The counter is in memory today and resets on restart (task B08 moves it to the database)."
      - from: api
        to: db
        label: "Check the password hash and create a session row"
        detail: "The password is verified against a slow salted hash. A session id is stored; only an opaque random value goes to the browser."
      - from: api
        to: browser
        label: "Set the cookie and return a CSRF token"
        detail: "The cookie is HttpOnly and SameSite=Lax. The CSRF token is returned in the body and sent back in a header on every unsafe request."
        failure:
          label: "A request arrives without the CSRF header"
          detail: "The Authenticated dependency rejects it with 403 before any code runs. A test walks every route and fails if one is unprotected."

  - id: add-job
    title: "Add a job"
    summary: "From the form to a de-duplicated job with an application and a history."
    status: built
    proof: [apps/api/tests/test_tracker_api.py]
    steps:
      - from: browser
        to: api
        label: "POST /jobs with company and role"
        detail: "The form validates required fields and links (http or https only) before sending."
      - from: api
        to: db
        label: "Look for the same job by fingerprint"
        detail: "A fingerprint of company, role and link (without tracking parameters) is checked per owner."
        failure:
          label: "It is already tracked"
          detail: "The API returns the existing job and the dialog says so with a link, instead of creating a duplicate."
      - from: api
        to: db
        label: "Insert company, job, application and first event in one transaction"
        detail: "The service owns the commit. Either everything is saved or nothing is."
        failure:
          label: "Two requests race"
          detail: "A unique constraint catches the loser, which then returns the winner's job."

  - id: answer-question
    title: "Answer a question"
    summary: "How one answer becomes a marked result and the next review date, safely even if sent twice."
    status: built
    proof: [apps/api/tests/test_learn_api.py, apps/api/tests/test_learn_scheduler.py]
    steps:
      - from: browser
        to: api
        label: "POST the answer with a token the browser made"
        detail: "The token is a random id for this one answer. It is what makes a repeat harmless."
        failure:
          label: "The same token arrives twice (double click, retry after a timeout)"
          detail: "The first answer is stored; the second returns that stored result and is marked already answered. Two at the same instant are resolved by a unique constraint."
      - from: api
        to: api
        label: "Mark it and turn it into a grade"
        detail: "Multiple choice is marked by code (partial credit for several-answer questions, never negative). Correct, how sure you were and how long you took become Again, Hard, Good or Easy."
      - from: api
        to: db
        label: "Update the schedule and store the attempt in one transaction"
        detail: "The FSRS scheduler computes the next due date from the card's memory state. The card and the attempt are saved together."
      - from: api
        to: browser
        label: "Reveal the answer"
        detail: "Only now are the correct option, explanation and sources sent. Before answering, the questions endpoint never includes them."

  - id: ask-notes
    title: "Ask my notes"
    summary: "A question becomes a cited answer, or an honest \"not in your notes\"."
    status: built
    proof: [apps/api/tests/test_knowledge_api.py, apps/api/tests/test_rag_eval.py]
    steps:
      - from: browser
        to: api
        label: "Ask a question"
        detail: "The question is embedded locally into a vector."
      - from: api
        to: db
        label: "Hybrid search"
        detail: "Vector similarity and full-text search each rank passages; the two rankings are merged with reciprocal rank fusion."
        failure:
          label: "Nothing is similar enough"
          detail: "Below the similarity threshold the best passages are returned with no written answer, and the page says it is not in your notes."
      - from: api
        to: claude
        label: "Write an answer from the passages only"
        detail: "Passages are wrapped as untrusted data. The model must cite passage ids."
        failure:
          label: "The model cites a passage that does not exist, or nothing"
          detail: "The answer is withheld and the passages are shown instead. Without an API key the passages are always shown."
      - from: api
        to: browser
        label: "Return the answer with citations"
        detail: "Citations link to the exact passages."

  - id: background-task
    title: "Background task lifecycle"
    summary: "How work runs outside a request and survives crashes."
    status: built
    proof: [apps/api/tests/test_tasks_worker.py]
    steps:
      - from: api
        to: db
        label: "Enqueue a task row with an idempotent key"
        detail: "Same key, same task: enqueuing twice does not duplicate work."
      - from: worker
        to: db
        label: "Claim with FOR UPDATE SKIP LOCKED"
        detail: "Several workers can ask at once; each gets different rows without waiting for the others."
      - from: worker
        to: sites
        label: "Do the work (for example fetch a job board)"
        detail: "Network access goes through the safe fetcher: private addresses are refused, size and time are capped."
        failure:
          label: "The site is down or the handler raises"
          detail: "A message written for you is stored, the task is retried with growing delays, and after the last attempt it is marked failed with a Retry button."
      - from: worker
        to: db
        label: "Mark done, or fail with a reason"
        detail: "A watchdog returns tasks stuck in running (a crashed worker) to the queue."
        failure:
          label: "The worker is killed mid-task"
          detail: "The task stays running until the watchdog frees it, then another run starts. Handlers are idempotent, so repeating is safe."

  - id: research-run
    title: "Research interview topics for a job"
    summary: "How the platform finds topics and questions for a job, under budgets, and waits for your approval."
    status: built
    proof: [apps/api/tests/test_research_api.py, apps/api/tests/test_research_rules.py]
    steps:
      - from: browser
        to: api
        label: "Add a job, choose \"Research this job\""
        detail: "Returns at once with a task id; the work happens in the background."
      - from: worker
        to: search
        label: "Plan queries and search"
        detail: "Up to eight queries made from the role, company and skills; blocked sites are removed."
        failure:
          label: "The search provider is down or over quota"
          detail: "The run ends as partial with a clear message; you can still paste a page by hand."
      - from: worker
        to: sites
        label: "Fetch pages"
        detail: "Only through the safe fetcher; robots.txt is respected; each host is rate-limited."
      - from: worker
        to: claude
        label: "Extract topics and questions with quotes"
        detail: "Page text is untrusted data. A quote must appear in the page or the item is dropped."
        failure:
          label: "A page contains instructions aimed at the model"
          detail: "They are treated as data. Output must match a fixed shape, quotes must verify, and nothing runs from page text."
      - from: worker
        to: db
        label: "Store findings in your inbox"
        detail: "Nothing enters your question bank until you approve it."

  - id: apply-queue
    title: "The daily apply list"
    summary: "How a few jobs a day are chosen and researched, and why nothing is applied for without you."
    status: built
    proof: [apps/api/tests/test_apply_enrich.py, apps/api/tests/test_apply_rules.py, apps/api/tests/test_apply_api.py]
    steps:
      - from: worker
        to: db
        label: "Choose jobs from your tracker"
        detail: "Jobs still New or Shortlisted, filtered by your apply policy file and scored against your CV profile."
      - from: worker
        to: sites
        label: "Check the company"
        detail: "The company checks run through the safe fetcher. A red flag or two failed checks hold the job back, and it is shown with the reason."
      - from: worker
        to: search
        label: "Look for pay and interview information"
        detail: "In order: the post, the same job on another site, an earlier or similar post by the company, similar roles elsewhere. Each answer keeps its level, source and the words it came from. Sites that forbid automation are never opened."
        failure:
          label: "The search service is down or not set up"
          detail: "The list is still built from the post and your tracker, and says the web was not searched."
      - from: browser
        to: api
        label: "You read the list and press Approve"
        detail: "The job becomes Shortlisted. You open the apply page yourself and press I applied afterwards."

  - id: account-setup
    title: "Set up your account and read your CV"
    summary: "How the app learns who you are and what you want, instead of having a person's details built in."
    status: built
    proof: [apps/api/tests/test_profile_setup.py, apps/web/e2e/profile.spec.ts]
    steps:
      - from: browser
        to: api
        label: "Answer the setup questions"
        detail: "Name, current role, the roles you want, levels, regions, work modes, pay, public links. Only fields you edited are sent."
      - from: browser
        to: api
        label: "Upload a CV (PDF, Word, text or a picture)"
        detail: "The file is read in memory with size, page and text limits; its type is decided by its first bytes; it is never stored."
        failure:
          label: "The file is a scan, damaged or hostile"
          detail: "A scan needs the optional OCR extra, otherwise you are asked to paste the text. Damaged, password-protected and oversized files are refused with a plain reason."
      - from: api
        to: db
        label: "Save skills, role titles and years read by rules"
        detail: "No model is used and nothing is sent anywhere. A name you typed is never overwritten by a guess."
      - from: browser
        to: api
        label: "Optionally read your public GitHub"
        detail: "Only the public repositories of the link you gave, through the safe fetcher; it suggests skills and saves nothing until you click one. LinkedIn and Naukri are never read."

