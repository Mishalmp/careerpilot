[project]
name = "careerpilot"
version = "0.1.0"
description = "CareerPilot API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "structlog>=24.4",
  "pyyaml>=6.0.3",
  "openpyxl>=3.1.5",
  "tzdata>=2026.6",
  "fastembed>=0.9.1",
  "pgvector>=0.5.1",
  "mcp>=1.0",
  "anthropic>=2.5.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
  "pyright>=1.1.390",
  "import-linter>=2.1",
  "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careerpilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]

[tool.ruff.lint.isort]
# The migrations folder is also called "alembic"; keep the library sorted as third-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]
"alembic/versions/*" = ["E501"]  # generated enum lists are long
"src/careerpilot/mcp_server.py" = ["E501"]  # tool descriptions and prompts are prose for the model

[tool.pyright]
include = ["src", "tests", "alembic"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.importlinter]
root_package = "careerpilot"

[[tool.importlinter.contracts]]
name = "core does not depend on modules"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["careerpilot.core"]
forbidden_modules = ["careerpilot.modules"]

[[tool.importlinter.contracts]]
name = "module layers (router > dependencies > service > repository)"
type = "layers"
containers = [
  "careerpilot.modules.auth",
  "careerpilot.modules.tracker",
  "careerpilot.modules.prep",
  "careerpilot.modules.practice",
  "careerpilot.modules.knowledge",
  "careerpilot.modules.today",
]
layers = ["router", "(dependencies)", "(service)", "(repository)"]

# Modules talk to each other through public service functions and schemas only.
[[tool.importlinter.contracts]]
name = "tracker keeps its internals private"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["careerpilot.modules.prep", "careerpilot.modules.practice", "careerpilot.modules.today", "careerpilot.modules.auth"]
forbidden_modules = ["careerpilot.modules.tracker.models", "careerpilot.modules.tracker.repository"]

[[tool.importlinter.contracts]]
name = "prep keeps its internals private"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["careerpilot.modules.tracker", "careerpilot.modules.practice", "careerpilot.modules.today", "careerpilot.modules.auth"]
forbidden_modules = ["careerpilot.modules.prep.models", "careerpilot.modules.prep.repository"]

[[tool.importlinter.contracts]]
name = "practice keeps its internals private"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["careerpilot.modules.tracker", "careerpilot.modules.prep", "careerpilot.modules.today", "careerpilot.modules.auth"]
forbidden_modules = ["careerpilot.modules.practice.models", "careerpilot.modules.practice.repository"]

[[tool.importlinter.contracts]]
name = "knowledge keeps its internals private"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["careerpilot.modules.tracker", "careerpilot.modules.prep", "careerpilot.modules.practice", "careerpilot.modules.today", "careerpilot.modules.auth"]
forbidden_modules = ["careerpilot.modules.knowledge.models", "careerpilot.modules.knowledge.repository"]

[[tool.importlinter.contracts]]
name = "auth keeps its internals private"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["careerpilot.modules.tracker", "careerpilot.modules.prep", "careerpilot.modules.practice", "careerpilot.modules.knowledge", "careerpilot.modules.today"]
forbidden_modules = ["careerpilot.modules.auth.models", "careerpilot.modules.auth.repository", "careerpilot.modules.auth.service"]

[[tool.importlinter.contracts]]
name = "nothing depends on the today aggregator"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["careerpilot.modules.tracker", "careerpilot.modules.prep", "careerpilot.modules.practice", "careerpilot.modules.knowledge", "careerpilot.modules.auth"]
forbidden_modules = ["careerpilot.modules.today"]
