[project]
name = "careerpilot"
version = "0.1.0"
description = "CareerPilot API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "structlog>=24.4",
  "pyyaml>=6.0.3",
  "openpyxl>=3.1.5",
  "tzdata>=2026.6",
  "fastembed>=0.9.1",
  "pgvector>=0.5.1",
  "mcp>=1.0",
  "anthropic>=2.5.0",
  "httpx>=0.28.1",
  "cryptography>=46",
  "fsrs>=6.3.2",
  "pypdf>=7.0.0",  # reads the text layer of an uploaded CV PDF; remove with the CV upload
  "pillow>=12",  # enlarges scanned CVs before OCR (profile/cvfile.py); was already installed via fastembed
]

[project.optional-dependencies]
# OCR for scanned CVs (a PDF or picture with no text in it). Optional because it pulls in onnxruntime
# and opencv (about 100 MB); without it the CV reader says so and asks for pasted text. Install with
# `uv sync --extra ocr`. Remove this extra and profile/cvfile.py's default_ocr to drop OCR.
ocr = ["rapidocr-onnxruntime>=1.4"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "pyright>=1.1.390",
  "import-linter>=2.1",
  "types-pyyaml>=6.0.12.20261103",
  "hypothesis>=6.170.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careerpilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]

[tool.ruff.lint.isort]
# The migrations folder is also called "alembic"; keep the library sorted as third-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]
"scripts/prepare_e2e.py" = ["S105"]  # a test-only password for the throwaway E2E database
"alembic/versions/*" = ["E501"]  # generated enum lists are long
"src/careerpilot/mcp_server.py" = ["E501"]  # tool descriptions and prompts are prose for the model
"src/careerpilot/modules/apply/pay.py" = ["RUF001"]  # it must recognise typographic dashes and currency signs
"src/careerpilot/modules/apply/chain.py" = ["RUF001"]  # page titles use typographic dashes
"src/careerpilot/modules/outreach/lint.py" = ["RUF001"]  # it must recognise typographic dashes and quotes

[tool.pyright]
include = ["src", "tests", "alembic"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.importlinter]
root_package = "careerpilot"

[[tool.importlinter.contracts]]
name = "core does not depend on modules"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["careerpilot.core"]
forbidden_modules = ["careerpilot.modules"]

[[tool.importlinter.contracts]]
name = "module layers (router > dependencies > service > repository)"
type = "layers"
containers = [
  "careerpilot.modules.auth",
  "careerpilot.modules.tracker",
  "careerpilot.modules.prep",
  "careerpilot.modules.practice",
  "careerpilot.modules.knowledge",
  "careerpilot.modules.verification",
  "careerpilot.modules.scoring",
  "careerpilot.modules.outreach",
  "careerpilot.modules.intel",
  "careerpilot.modules.mock",
  "careerpilot.modules.discovery",
  "careerpilot.modules.tasks",
  "careerpilot.modules.digest",
  "careerpilot.modules.analytics",
  "careerpilot.modules.offers",
  "careerpilot.modules.stories",
  "careerpilot.modules.learn",
  "careerpilot.modules.architecture",
  "careerpilot.modules.research",
  "careerpilot.modules.system",
  "careerpilot.modules.profile",
  "careerpilot.modules.apply",
  "careerpilot.modules.today",
]
layers = ["router", "(dependencies)", "(service)", "(repository)"]

# Modules talk to each other through public service functions and schemas only.
